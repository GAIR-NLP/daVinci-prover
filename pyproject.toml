[project]
name = "dvp"
version = "0.7.0"
description = "DaVinci Prover with its trusted execution layer."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.24,<1",
    "litellm>=1.108.0,<2",
    "openai>=2.20,<3",
    "tenacity>=9,<10",
]

[project.urls]
Homepage = "https://github.com/zwhong714/daVinci-prover"
Documentation = "https://github.com/zwhong714/daVinci-prover/tree/main/docs"
Repository = "https://github.com/zwhong714/daVinci-prover"

[project.optional-dependencies]
python-experiments = [
    "numpy>=1.26,<3",
    "sympy>=1.12,<2",
    "mpmath>=1.3,<2",
]
# Keep the SDK's internal API and BM25 index loader within their current series.
lean-explore-local = [
    "lean-explore[local]>=1.3.0,<1.4",
    "torch>=2.9.1,<3",
    "transformers>=4.57.1,<6",
    "sentence-transformers>=5.7.0,<6",
    "faiss-cpu>=1.15.1,<2",
    "numpy>=2.4.0,<3",
    "bm25s>=0.3.13,<0.4",
]
test = [
    "pytest>=7",
]

[project.scripts]
dvp = "dvp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dvp*"]

[tool.setuptools.package-data]
"dvp.verification" = ["resources/*.lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
